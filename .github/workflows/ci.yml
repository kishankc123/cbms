name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build-time only — no route in this app queries the database during
      # `next build` (every (app) route is dynamically rendered behind auth),
      # so these just need to be well-formed enough for module init to pass.
      DATABASE_URL: postgresql://user:password@localhost:5432/cbms
      AUTH_SECRET: ci-placeholder-secret-not-for-production-use-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Includes the Bikram Sambat cross-check against independent libraries, so
      # a calendar-data change (e.g. a Dependabot upgrade) cannot merge unnoticed.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
