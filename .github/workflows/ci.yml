name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  # Applies every migration to an empty database, so broken SQL or a bad
  # migration order is caught on the PR instead of during a production deploy.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cbms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cbms
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply all migrations to an empty database
        run: node ./node_modules/drizzle-kit/bin.cjs migrate

  build:
    runs-on: ubuntu-latest
    env:
      # Build-time only — no route in this app queries the database during
      # `next build` (every (app) route is dynamically rendered behind auth),
      # so these just need to be well-formed enough for module init to pass.
      DATABASE_URL: postgresql://user:password@localhost:5432/cbms
      AUTH_SECRET: ci-placeholder-secret-not-for-production-use-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Includes the Bikram Sambat cross-check against independent libraries, so
      # a calendar-data change (e.g. a Dependabot upgrade) cannot merge unnoticed.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
